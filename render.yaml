# Free preview service. Keep one instance: rooms are held in process memory.
services:
  - type: web
    name: spark-arena
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: HOST_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_ROOMS
        value: "100"
      - key: MAX_PLAYERS
        value: "40"
